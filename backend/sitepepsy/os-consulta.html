<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Consulta de OS</title>
  <link rel="stylesheet" href="style.css">
</head>
<body data-page="consulta">
  <main class="app-main">
    <div class="cabecalho"><h1>Consultar OS</h1><a class="btn" href="os-cadastro.html">Nova OS</a></div>
    <section class="card">
      <div class="filtros">
        <div class="input-group"><label for="busca">Buscar</label><input type="search" id="busca" placeholder="Nº, cliente ou equipamento"></div>
        <div class="input-group"><label for="f-status">Status</label><select id="f-status"></select></div>
        <div class="input-group"><label for="f-tecnico">Técnico</label><select id="f-tecnico"></select></div>
      </div>
    </section>
    <section class="card"><div class="tabela-wrap"><table><thead><tr><th>Nº</th><th>Cliente</th><th>Equipamento</th><th>Prioridade</th><th>Técnico</th><th>Status</th><th></th></tr></thead><tbody id="lista"></tbody></table></div></section>
  </main>
  <script src="script.js"></script>
</body>
</html>
