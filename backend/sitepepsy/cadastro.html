<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cadastro</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="container">
    <form class="login-form" id="form-cadastro" action="#" method="post">
      <h1>Cadastro</h1>

      <div class="input-group">
        <label for="nome">Nome completo</label>
        <input type="text" id="nome" name="nome" placeholder="Digite seu nome" required>
      </div>

      <div class="input-group">
        <label for="email">E-mail</label>
        <input type="email" id="email" name="email" placeholder="Digite seu e-mail" required>
      </div>

      <div class="input-group">
        <label for="senha">Senha</label>
        <input type="password" id="senha" name="senha" placeholder="Mínimo de 6 caracteres" minlength="6" required>
      </div>

      <div class="input-group">
        <label for="confirmar-senha">Confirmar senha</label>
        <input type="password" id="confirmar-senha" name="confirmar-senha" placeholder="Repita sua senha" minlength="6" required>
      </div>

      <label class="remember">
        <input type="checkbox" name="termos" required> Aceito os termos de uso
      </label>

      <p class="mensagem-erro" id="erro" role="alert"></p>

      <button type="submit">Cadastrar</button>

      <p class="register">
        Já tem uma conta? <a href="index.html">Entrar</a>
      </p>
    </form>
  </main>

  <script src="script.js"></script>
</body>
</html>
