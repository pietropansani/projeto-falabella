<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tela de Login</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="container">
    <form class="login-form" id="form-login" action="#" method="post">
      <h1>Login</h1>

      <div class="input-group">
        <label for="email">E-mail</label>
        <input type="email" id="email" name="email" placeholder="Digite seu e-mail" required>
      </div>

      <div class="input-group">
        <label for="senha">Senha</label>
        <input type="password" id="senha" name="senha" placeholder="Digite sua senha" required>
      </div>

      <div class="options">
        <label class="remember">
          <input type="checkbox" name="lembrar"> Lembrar de mim
        </label>
        <a href="esqueci-senha.html">Esqueci a senha</a>
      </div>

      <p class="mensagem-erro" role="alert"></p>

      <button type="submit">Entrar</button>

      <p class="register">
        Não tem uma conta? <a href="cadastro.html">Registre-se</a>
      </p>
    </form>
  </main>

  <script src="script.js"></script>
</body>
</html>
