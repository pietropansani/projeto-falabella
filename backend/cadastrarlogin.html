<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastrar Conta | Syntax Lab</title>
    <link rel="icon" type="image/png" href="IMG/logo-removebg-preview2.png">
</head>
<body>
    <template id="cadastro-modal-template">
        <div class="modal-cabecalho">
            <div>
                <h2 id="titulo-cadastro">Criar conta</h2>
                <p>Preencha seus dados para se cadastrar.</p>
            </div>
            <button type="button" class="modal-fechar" data-fechar-modal aria-label="Fechar janela">Fechar</button>
        </div>

        <form id="formCadastro" class="formulario">
            <div class="campo">
                <label for="nomeCadastro">Nome completo</label>
                <input type="text" name="nome" id="nomeCadastro" placeholder="Digite seu nome" autocomplete="name" maxlength="120" required>
            </div>

            <div class="campo">
                <label for="emailCadastro">E-mail</label>
                <input type="email" name="email" id="emailCadastro" placeholder="seuemail@exemplo.com" autocomplete="email" maxlength="254" required>
            </div>

            <div class="campo">
                <label for="senhaCadastro">Senha</label>
                <input type="password" name="senha" id="senhaCadastro" placeholder="Mínimo de 6 caracteres" autocomplete="new-password" minlength="6" required>
            </div>

            <div class="campo">
                <label for="rmCadastro">RM</label>
                <input type="text" name="rm" id="rmCadastro" placeholder="Digite seu RM" maxlength="30" required>
            </div>

            <div class="campo">
                <label for="nascimentoCadastro">Data de nascimento</label>
                <input type="date" name="data_nascimento" id="nascimentoCadastro" autocomplete="bday" required>
            </div>

            <div class="campo">
                <label for="generoCadastro">Gênero</label>
                <select name="genero" id="generoCadastro" required>
                    <option value="" disabled selected>Selecione seu gênero</option>
                    <option value="Masculino">Masculino</option>
                    <option value="Feminino">Feminino</option>
                    <option value="Prefiro_nao_dizer">Prefiro não dizer</option>
                </select>
            </div>

            <p class="cadastro-feedback" id="cadastroFeedback" role="status" aria-live="polite"></p>

            <div class="form-acoes">
                <button type="submit" class="entrar">Cadastrar</button>
            </div>
        </form>
    </template>
</body>
</html>
