<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | Syntax Lab</title>
    <link rel="icon" type="image/png" href="IMG/logo-removebg-preview2.png">
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body class="pagina-login">
    <main class="login-container">
        <div class="login-cabecalho">
            <h1>Syntax Lab</h1>
        </div>

        <section class="login-card">
            <h2>Acesse sua conta</h2>

            <form id="formLogin" class="formulario">
                <div class="campo">
                    <label for="email">E-mail</label>
                    <input type="email" name="email" id="email" placeholder="seuemail@exemplo.com" autocomplete="email" required>
                </div>

                <div class="campo">
                    <label for="senha">Senha</label>
                    <input type="password" name="senha" id="senha" placeholder="Digite sua senha" autocomplete="current-password" required>
                </div>

                <div class="form-acoes">
                    <button type="submit" class="entrar">Entrar</button>
                    <a class="link-senha" href="#recuperar-senha" id="linkSenha">Esqueci minha senha</a>
                    <p class="login-cadastro">Não tem uma conta? <button type="button" class="link-cadastro" id="abrirCadastro">Cadastrar</button></p>
                </div>
                <p class="login-feedback" id="loginFeedback" role="status" aria-live="polite"></p>
            </form>
        </section>
    </main>

    <dialog class="modal-cadastro" id="modalCadastro" aria-labelledby="titulo-cadastro"></dialog>

    <script>
        const formLogin = document.getElementById('formLogin');
        const loginFeedback = document.getElementById('loginFeedback');
        const modalCadastro = document.getElementById('modalCadastro');
        const botaoAbrirCadastro = document.getElementById('abrirCadastro');
        let cadastroCarregado = false;

        formLogin.addEventListener('submit', async (evento) => {
            evento.preventDefault();
            loginFeedback.textContent = '';

            try {
                const resposta = await fetch('/api/usuarios/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        email: document.getElementById('email').value,
                        senha: document.getElementById('senha').value
                    })
                });
                const resultado = await resposta.json();

                if (!resposta.ok) {
                    throw new Error(resultado.erro || 'Não foi possível entrar.');
                }

                window.location.href = 'inicio.html';
            } catch (erro) {
                loginFeedback.textContent = erro.message;
            }
        });

        document.getElementById('linkSenha').addEventListener('click', (evento) => {
            evento.preventDefault();
            loginFeedback.textContent = 'A recuperação de senha ainda não está disponível.';
        });

        botaoAbrirCadastro.addEventListener('click', async () => {
            loginFeedback.textContent = '';

            if (!cadastroCarregado) {
                try {
                    const resposta = await fetch('cadastrarlogin.html');
                    if (!resposta.ok) throw new Error('Não foi possível abrir o cadastro.');

                    const documento = new DOMParser().parseFromString(
                        await resposta.text(),
                        'text/html'
                    );
                    const template = documento.getElementById('cadastro-modal-template');
                    if (!template) throw new Error('O formulário de cadastro não foi encontrado.');

                    modalCadastro.replaceChildren(template.content.cloneNode(true));
                    const formCadastro = modalCadastro.querySelector('#formCadastro');
                    const cadastroFeedback = modalCadastro.querySelector('#cadastroFeedback');

                    modalCadastro.querySelector('[data-fechar-modal]').addEventListener('click', () => {
                        modalCadastro.close();
                    });

                    formCadastro.addEventListener('submit', async (eventoCadastro) => {
                        eventoCadastro.preventDefault();
                        cadastroFeedback.textContent = '';
                        const botaoEnviar = formCadastro.querySelector('[type="submit"]');
                        botaoEnviar.disabled = true;

                        try {
                            const dados = Object.fromEntries(new FormData(formCadastro));
                            const respostaCadastro = await fetch('/api/usuarios/cadastro', {
                                method: 'POST',
                                headers: { 'Content-Type': 'application/json' },
                                body: JSON.stringify(dados)
                            });
                            const resultadoCadastro = await respostaCadastro.json();

                            if (!respostaCadastro.ok) {
                                throw new Error(resultadoCadastro.erro || 'Não foi possível cadastrar.');
                            }

                            document.getElementById('email').value = dados.email;
                            document.getElementById('senha').focus();
                            modalCadastro.close();
                            loginFeedback.textContent = 'Cadastro concluído. Agora entre com sua senha.';
                        } catch (erroCadastro) {
                            cadastroFeedback.textContent = erroCadastro.message;
                        } finally {
                            botaoEnviar.disabled = false;
                        }
                    });

                    cadastroCarregado = true;
                } catch (erro) {
                    loginFeedback.textContent = erro.message;
                    return;
                }
            }

            modalCadastro.showModal();
            modalCadastro.querySelector('#nomeCadastro').focus();
        });

        modalCadastro.addEventListener('click', (evento) => {
            if (evento.target === modalCadastro) modalCadastro.close();
        });

        modalCadastro.addEventListener('close', () => botaoAbrirCadastro.focus());
    </script>
</body>
</html>
