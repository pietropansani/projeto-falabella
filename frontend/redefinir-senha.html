<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Redefinir senha</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="container">
    <form class="login-form" id="form-redefinir" action="#" method="post">
      <h1>Nova senha</h1>

      <div class="input-group">
        <label for="senha">Nova senha</label>
        <input type="password" id="senha" name="senha" placeholder="Mínimo de 6 caracteres" minlength="6" required>
      </div>

      <div class="input-group">
        <label for="confirmar-senha">Confirmar nova senha</label>
        <input type="password" id="confirmar-senha" name="confirmar-senha" placeholder="Repita a senha" minlength="6" required>
      </div>

      <p class="mensagem-erro" role="alert"></p>
      <p class="mensagem-sucesso" role="status"></p>

      <button type="submit">Salvar nova senha</button>

      <p class="register">
        <a href="index.html">Voltar ao login</a>
      </p>
    </form>
  </main>

  <script src="script.js"></script>
</body>
</html>
